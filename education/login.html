<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — GELL · Gemini Education Learning Library</title>
  <link rel="icon" href="../logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#0a1628; --navy2:#0c1d36; --panel:#0f2138; --line:#1c3354;
      --blue:#1a6fc4; --bright:#2e8de8; --light:#5aaff5; --off:#e8edf5; --gray:#8a9ab5;
      --ink:#0d1b30; --ink2:#3a4a63; --field:#f3f5f9; --field-line:#d5dde8;
      --display:'Bebas Neue',sans-serif; --cond:'Barlow Condensed',sans-serif; --body:'Barlow',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{margin:0;font-family:var(--body);font-weight:300;color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--navy);}
    a{text-decoration:none;color:inherit;}
    .shell{display:grid;grid-template-columns:1.02fr .98fr;min-height:100vh;}

    /* ---------- LEFT / brand ---------- */
    .brandside{position:relative;overflow:hidden;background:#0a1628 url('login-brand.png') center center / cover no-repeat;}

    /* ---------- RIGHT / form ---------- */
    .formside{background:#ffffff;display:flex;align-items:center;justify-content:center;padding:44px 30px;}
    .card{width:100%;max-width:420px;}
    .eyebrow{font-family:var(--cond);font-weight:700;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);padding-bottom:8px;border-bottom:2px solid var(--blue);display:inline-block;margin-bottom:22px;}
    .card h1{font-family:var(--display);font-weight:400;font-size:46px;line-height:.95;letter-spacing:.01em;color:var(--ink);margin:0 0 10px;}
    .card .sub{color:var(--ink2);font-size:15px;margin:0 0 26px;}
    label{display:block;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--blue);margin:0 0 7px;}
    .fieldgrp{margin-bottom:18px;}
    .field{position:relative;display:flex;align-items:center;}
    .field .lead-ic{position:absolute;left:14px;display:flex;color:#8a97ab;pointer-events:none;}
    .field input{width:100%;padding:14px 44px 14px 44px;border:1px solid var(--field-line);background:var(--field);color:var(--ink);border-radius:11px;font-size:15px;font-family:var(--body);transition:border-color .15s,box-shadow .15s;}
    .field input:focus{outline:none;border-color:var(--bright);box-shadow:0 0 0 3px rgba(46,141,232,.15);background:#fff;}
    .field input::placeholder{color:#9aa6ba;}
    .eye{position:absolute;right:10px;background:none;border:0;cursor:pointer;color:#8a97ab;padding:6px;display:flex;border-radius:8px;}
    .eye:hover{color:var(--blue);}
    button.primary{width:100%;margin-top:6px;padding:15px;border:0;border-radius:11px;background:var(--ink);color:#fff;
      font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:15px;cursor:pointer;transition:background .18s,transform .05s;}
    button.primary:hover{background:#12294a;}
    button.primary:active{transform:translateY(1px);}
    .forgot{display:block;text-align:center;margin-top:16px;color:var(--blue);font-weight:500;font-size:14px;cursor:pointer;}
    .forgot:hover{color:var(--bright);}
    .msg{min-height:20px;margin-top:14px;font-size:13.5px;text-align:center;}
    .msg.err{color:#c0392b;} .msg.ok{color:#1e7a46;}
    .altrow{text-align:center;margin-top:14px;font-size:13.5px;color:var(--ink2);}
    .altrow a{color:var(--blue);font-weight:600;cursor:pointer;}
    .powered{margin-top:34px;text-align:center;}
    .powered .pl{font-family:var(--cond);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;color:#9aa6ba;position:relative;margin-bottom:12px;}
    .powered .pl::before,.powered .pl::after{content:"";position:absolute;top:50%;width:46px;height:1px;background:#dfe4ec;}
    .powered .pl::before{left:calc(50% - 120px);} .powered .pl::after{right:calc(50% - 120px);}
    .powered img{height:30px;width:auto;opacity:.92;}
    .backlink{position:absolute;top:20px;left:24px;font-family:var(--cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12px;color:#9fb6d8;z-index:5;}
    .backlink:hover{color:#fff;}

    @media(max-width:860px){
      .shell{grid-template-columns:1fr;}
      .brandside{padding:52px 28px 44px;min-height:auto;}
      .gell{font-size:70px;} .logo{height:92px;} .book{width:180px;}
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- LEFT: brand (your generated art) -->
    <div class="brandside">
      <a class="backlink" href="../education.html">&larr; Gemini Education</a>
    </div>

    <!-- RIGHT: form -->
    <div class="formside">
      <div class="card" id="card"><div class="sub">Loading…</div></div>
    </div>
  </div>

  <!-- pre-launch passcode curtain -->
  <script>
    (function(){ var K="gemEduPreviewUnlocked"; function u(){ try{return sessionStorage.getItem(K)==="yes";}catch(e){return false;} } if(!u()) void 0; })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
  (function(){
    var card=document.getElementById("card");
    var MAIL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
    var LOCK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    var EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';

    if(!window.GEM || !window.GEM.ready){
      card.innerHTML='<div class="eyebrow">Gemini Education Learning Library</div><h1>Warming up</h1><div class="sub">The library is starting up (it was idle). Give it a minute and refresh.</div>';
      return;
    }
    var mode="signin";
    function render(){
      card.innerHTML=
        '<div class="eyebrow">Gemini Education Learning Library</div>'+
        '<h1>'+(mode==="signup"?"Create your account":"Enter the learning library")+'</h1>'+
        '<div class="sub">'+(mode==="signup"?"Start learning and track your progress across every course.":"Sign in to access your courses, resources, and learning dashboard.")+'</div>'+
        (mode==="signup"?'<div class="fieldgrp"><label>Full name</label><div class="field"><span class="lead-ic">'+
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>'+
          '</span><input id="name" autocomplete="name" placeholder="Your name"></div></div>':'')+
        '<div class="fieldgrp"><label>Email</label><div class="field"><span class="lead-ic">'+MAIL+'</span>'+
          '<input id="email" type="email" autocomplete="email" placeholder="Enter your email"></div></div>'+
        '<div class="fieldgrp"><label>Password</label><div class="field"><span class="lead-ic">'+LOCK+'</span>'+
          '<input id="pw" type="password" autocomplete="'+(mode==="signup"?"new-password":"current-password")+'" placeholder="Enter your password">'+
          '<button type="button" class="eye" id="eye" aria-label="Show password">'+EYE+'</button></div></div>'+
        '<button class="primary" id="go">'+(mode==="signup"?"Create account":"Sign In")+'</button>'+
        (mode==="signup"?'':'<span class="forgot" id="forgot">Forgot password?</span>')+
        '<div class="msg" id="msg"></div>'+
        '<div class="altrow">'+(mode==="signup"
            ? 'Already have an account? <a id="toin">Sign in</a>'
            : 'New here? <a id="toup">Create an account</a>')+'</div>'+
        '<div class="powered"><div class="pl">Powered by</div>'+
          '<img src="../logo-transparent.png" alt="Gemini Coach" onerror="this.style.display=\'none\'"></div>';

      var $=function(id){return document.getElementById(id);};
      function msg(t,ok){ $("msg").textContent=t; $("msg").className="msg "+(ok?"ok":"err"); }
      if($("toup")) $("toup").onclick=function(){mode="signup";render();};
      if($("toin")) $("toin").onclick=function(){mode="signin";render();};
      var eye=$("eye"); if(eye) eye.onclick=function(){ var p=$("pw"); p.type=(p.type==="password"?"text":"password"); };
      $("go").onclick=function(){
        var email=($("email").value||"").trim(), pw=$("pw").value;
        if(!email||!pw){ msg("Enter your email and password."); return; }
        msg("Working…",true);
        if(mode==="signup"){
          var nm=$("name")?$("name").value.trim():"";
          GEM.signUp(email,pw,nm).then(function(r){
            if(r.error) return msg(r.error.message);
            if(r.data&&r.data.session) location.href="index.html";
            else msg("Account created. Check your email if confirmation is required, then sign in.",true);
          });
        } else {
          GEM.signIn(email,pw).then(function(r){ if(r.error) return msg(r.error.message); location.href="index.html"; });
        }
      };
      if($("forgot")) $("forgot").onclick=function(){
        var email=($("email").value||"").trim();
        if(!email){ msg("Enter your email above first, then tap Forgot password."); return; }
        msg("Sending a sign-in link…",true);
        GEM.magicLink(email, location.href.replace("login.html","index.html")).then(function(r){
          msg(r.error?r.error.message:"Check your email for a secure sign-in link.", !r.error);
        });
      };
    }
    GEM.getUser().then(function(u){ if(u) location.href="index.html"; else render(); });
  })();
  </script>
</body>
</html>
