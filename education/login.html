<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — GELL</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;0,700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --navy:#0a1628; --panel:#0f2138; --panel2:#0d1f3c; --line:#1c3354; --blue:#1a6fc4; --bright:#2e8de8; --light:#5aaff5; --off:#e8edf5; --gray:#8a9ab5; }
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--navy);color:var(--off);font-family:'Barlow',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
    a{color:var(--light);text-decoration:none;}
    .shell{display:grid;grid-template-columns:1.05fr .95fr;min-height:100vh;}
    .brandside{position:relative;overflow:hidden;padding:56px 54px;display:flex;flex-direction:column;justify-content:center;
      background:radial-gradient(900px 500px at 20% 0%,rgba(46,141,232,.22),transparent 60%),linear-gradient(160deg,#0c1d36,#0a1628 60%);border-right:1px solid var(--line);}
    .emblem{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,#12345f,#1a6fc4);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(26,111,196,.4);}
    .brandside h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:68px;line-height:.86;letter-spacing:.02em;color:#fff;margin:20px 0 2px;}
    .brandside .mean{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--light);}
    .brandside p{max-width:400px;margin:18px 0 0;font-size:15.5px;line-height:1.7;color:#aab8d2;}
    .studymotif{position:absolute;right:-40px;bottom:-40px;width:300px;height:300px;opacity:.14;pointer-events:none;}
    .formside{display:flex;align-items:center;justify-content:center;padding:40px 28px;}
    .card{width:100%;max-width:380px;}
    .card h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:36px;letter-spacing:.02em;color:#fff;margin:0 0 4px;}
    .card .sub{color:var(--gray);font-size:14px;margin:0 0 22px;}
    .tabs{display:flex;gap:6px;margin-bottom:16px;}
    .tabs button{flex:1;padding:9px;border:1px solid var(--line);background:transparent;color:var(--gray);font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;border-radius:8px;cursor:pointer;}
    .tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
    label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--gray);margin:14px 0 5px;}
    input{width:100%;padding:12px 14px;border:1px solid var(--line);background:#0b1d33;color:#fff;border-radius:9px;font-size:15px;font-family:'Barlow',sans-serif;}
    input::placeholder{color:#67809f;}
    button.primary{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;cursor:pointer;}
    button.primary:hover{background:var(--bright);}
    button.ghost{width:100%;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--light);font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;cursor:pointer;}
    .msg{margin-top:14px;font-size:13px;min-height:18px;}
    .msg.err{color:#ff8585;} .msg.ok{color:#7fd1a6;}
    .backlink{display:inline-block;margin-top:20px;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.04em;font-size:12.5px;color:var(--gray);}
    @media(max-width:820px){ .shell{grid-template-columns:1fr;} .brandside{padding:44px 30px;min-height:auto;} .brandside h1{font-size:54px;} .studymotif{display:none;} }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brandside">
      <div class="emblem" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#bfe0ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6c-1.6-1.2-3.7-1.6-6-1.2v12c2.3-.4 4.4 0 6 1.2 1.6-1.2 3.7-1.6 6-1.2v-12c-2.3-.4-4.4 0-6 1.2z"/><path d="M12 6v12"/>
        </svg>
      </div>
      <h1>GELL</h1>
      <div class="mean">Gemini Education Learning Library</div>
      <p>Pick up where you left off. Your progress, quizzes, and certificates all live here — the science, taught like a coach.</p>
      <svg class="studymotif" viewBox="0 0 24 24" fill="none" stroke="#5aaff5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 6c-1.6-1.2-3.7-1.6-6-1.2v12c2.3-.4 4.4 0 6 1.2 1.6-1.2 3.7-1.6 6-1.2v-12c-2.3-.4-4.4 0-6 1.2z"/><path d="M12 6v12"/><circle cx="12" cy="12" r="10"/>
      </svg>
    </div>
    <div class="formside">
      <div class="card" id="card"><div class="sub">Loading…</div></div>
    </div>
  </div>

  <!-- pre-launch curtain -->
  <script>
    (function(){ var K="gemEduPreviewUnlocked"; function u(){ try{return sessionStorage.getItem(K)==="yes";}catch(e){return false;} } if(!u()) location.replace("coming-soon.html"); })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
  (function(){
    var card=document.getElementById("card");
    if(!window.GEM || !window.GEM.ready){ card.innerHTML='<h2>Warming up</h2><div class="sub">The library is starting (it was idle). Refresh in a minute.</div>'; return; }
    var mode="signin";
    function render(){
      card.innerHTML=
        '<h2>'+(mode==="signup"?"Create your account":"Welcome back")+'</h2>'+
        '<div class="sub">'+(mode==="signup"?"Start learning and track your progress.":"Log in to your library.")+'</div>'+
        '<div class="tabs"><button id="t-in" class="'+(mode==="signin"?"active":"")+'">Log in</button><button id="t-up" class="'+(mode==="signup"?"active":"")+'">Create account</button></div>'+
        (mode==="signup"?'<label>Full name</label><input id="name" autocomplete="name">':"")+
        '<label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@email.com">'+
        '<label>Password</label><input id="pw" type="password" autocomplete="'+(mode==="signup"?"new-password":"current-password")+'" placeholder="At least 6 characters">'+
        '<button class="primary" id="go">'+(mode==="signup"?"Create account":"Log in")+'</button>'+
        '<button class="ghost" id="magic">Email me a magic link instead</button>'+
        '<div class="msg" id="msg"></div>'+
        '<a class="backlink" href="../gell.html">&larr; Back to Gemini Education</a>';
      var $=function(id){return document.getElementById(id);};
      $("t-in").onclick=function(){mode="signin";render();};
      $("t-up").onclick=function(){mode="signup";render();};
      function msg(t,ok){ $("msg").textContent=t; $("msg").className="msg "+(ok?"ok":"err"); }
      $("go").onclick=function(){
        var email=$("email").value.trim(), pw=$("pw").value;
        if(!email||!pw){ msg("Enter your email and password."); return; }
        msg("Working…",true);
        if(mode==="signup"){
          var nm=$("name")?$("name").value.trim():"";
          GEM.signUp(email,pw,nm).then(function(r){
            if(r.error) return msg(r.error.message);
            if(r.data&&r.data.session) location.href="index.html";
            else msg("Account created. Check your email if confirmation is required, then log in.",true);
          });
        } else {
          GEM.signIn(email,pw).then(function(r){ if(r.error) return msg(r.error.message); location.href="index.html"; });
        }
      };
      $("magic").onclick=function(){
        var email=$("email").value.trim(); if(!email){ msg("Enter your email first."); return; }
        GEM.magicLink(email, location.href.replace("login.html","index.html")).then(function(r){
          msg(r.error?r.error.message:"Magic link sent. Check your email.", !r.error);
        });
      };
    }
    GEM.getUser().then(function(u){ if(u) location.href="index.html"; else render(); });
  })();
  </script>
</body>
</html>
