<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account — Gemini Education</title>
  <link rel="icon" href="../logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#0a1628; --navy-mid:#0d1f3c; --panel:#0f2138; --panel2:#0d1f3c; --line:#1c3354;
      --blue:#1a6fc4; --bright:#2e8de8; --light:#5aaff5; --off:#e8edf5; --gray:#8a9ab5;
      --gold:#e0a43a; --green:#36c98d;
      --display:'Bebas Neue',sans-serif; --cond:'Barlow Condensed',sans-serif; --body:'Barlow',system-ui,sans-serif;
      --shadow:0 14px 34px rgba(0,0,0,.35); --shadow-sm:0 8px 22px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--navy);color:var(--off);font-family:var(--body);font-weight:300;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;}
    a{color:inherit;text-decoration:none;}
    .wrap{max-width:1060px;margin:0 auto;padding:0 24px;}
    nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:11px;padding:14px 24px;background:rgba(10,22,40,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
    nav img{height:28px;width:auto;} nav .logo{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 210deg,var(--blue),var(--light),var(--blue));}
    nav b{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.06em;color:#fff;}
    nav .sp{flex:1;}
    nav a.nl{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);}
    nav a.nl:hover{color:#fff;}
    nav .out{font-family:var(--cond);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#bfd3ee;border:1px solid #2a5285;border-radius:8px;padding:7px 13px;cursor:pointer;background:transparent;}
    nav .out:hover{border-color:var(--light);color:#fff;}
    .hero{background:radial-gradient(1100px 480px at 12% -25%,rgba(46,141,232,.22),transparent 60%),linear-gradient(180deg,#0b1a30,#0a1628);padding:46px 0 62px;border-bottom:1px solid var(--line);}
    .heroin{display:flex;align-items:center;gap:20px;}
    .avatar{width:64px;height:64px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,#12345f,#1a6fc4);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:34px;color:#fff;border:2px solid rgba(224,164,58,.55);box-shadow:0 10px 26px rgba(26,111,196,.45);}
    .eyebrow{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--light);}
    .hero h1{font-family:var(--display);font-weight:400;font-size:50px;line-height:.98;letter-spacing:.02em;color:#fff;margin:4px 0 10px;}
    .statusrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .chip{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
    .chip.member{background:linear-gradient(135deg,rgba(224,164,58,.22),rgba(224,164,58,.08));color:#f3d698;border:1px solid #6b4f1c;}
    .chip.email{background:rgba(15,33,56,.7);color:var(--gray);border:1px solid var(--line);font-weight:600;letter-spacing:.03em;text-transform:none;font-family:var(--body);font-size:13px;}
    section.blk{padding:16px 0;}
    .sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 2px 14px;}
    h2.sec{font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--off);margin:0;}
    .sechead a.more{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--light);}
    .resume{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,#103257,#1a6fc4);border:1px solid #2a72bf;border-radius:14px;padding:18px 24px;margin-top:-34px;position:relative;box-shadow:var(--shadow);}
    .resume .rk{font-family:var(--cond);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#bfe0ff;}
    .resume .rt{font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:.03em;color:#fff;margin-top:3px;}
    .resume .btn{font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;background:#fff;color:#0d2747;border-radius:8px;padding:11px 19px;white-space:nowrap;}
    .resume .btn:hover{background:#eaf3ff;}
    .snap{display:grid;grid-template-columns:250px 1fr;gap:18px;}
    @media(max-width:720px){ .snap{grid-template-columns:1fr;} }
    .ringcard{background:radial-gradient(340px 220px at 50% 0%,rgba(46,141,232,.12),transparent 70%),var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .ring{position:relative;display:flex;align-items:center;justify-content:center;height:172px;}
    .ring .mid{position:absolute;text-align:center;}
    .ring .mid .big{font-family:var(--display);font-weight:400;font-size:46px;color:#fff;line-height:1;}
    .ring .mid .lab{font-family:var(--cond);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--gray);margin-top:2px;}
    .rsub{font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;color:var(--gray);margin-top:6px;text-align:center;}
    .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
    @media(max-width:520px){ .tiles{grid-template-columns:1fr 1fr;} }
    .tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:var(--shadow-sm);overflow:hidden;}
    .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}
    .tile.b::before{background:var(--bright);} .tile.g::before{background:var(--green);} .tile.o::before{background:var(--gold);} .tile.v::before{background:#8f7be6;}
    .tile .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
    .tile.b .ic{background:rgba(46,141,232,.15);color:#7fc0f7;} .tile.g .ic{background:rgba(54,201,141,.15);color:#7fe0b6;}
    .tile.o .ic{background:rgba(224,164,58,.15);color:#f0cf8a;} .tile.v .ic{background:rgba(143,123,230,.16);color:#c3b8f5;}
    .tile .n{font-family:var(--display);font-weight:400;font-size:32px;color:#fff;line-height:1;}
    .tile .l{font-family:var(--cond);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:11px;color:var(--gray);margin-top:4px;}
    .chartcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow-sm);}
    .pcrow{margin-bottom:20px;} .pcrow:last-child{margin-bottom:0;}
    .pchd{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
    .pchd .cc{font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#0a1628;padding:2px 8px;border-radius:5px;}
    .pchd .pl{font-size:14px;color:#eaf0fa;}
    .pcbar{display:flex;align-items:center;gap:12px;margin-bottom:7px;}
    .pcbar .tag{width:66px;font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--gray);flex:0 0 auto;}
    .pcbar .track{flex:1;height:12px;border-radius:6px;background:#0a1c31;border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
    .pcbar .track > span{display:block;height:100%;border-radius:6px;}
    .pcbar .val{width:52px;text-align:right;font-family:var(--cond);font-weight:700;font-size:12.5px;color:#dbe4f2;flex:0 0 auto;}
    .fill-read{background:linear-gradient(90deg,#1a6fc4,#5aaff5);}
    .fill-exam{background:linear-gradient(90deg,#b9791f,#e0a43a);}
    .na{color:#5f7391;}
    .legend{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;}
    .legend span{font-family:var(--cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:11.5px;color:var(--gray);display:inline-flex;align-items:center;gap:7px;}
    .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
    .ccard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,transform .12s;box-shadow:var(--shadow-sm);}
    .ccard:hover{border-color:var(--blue);transform:translateY(-2px);}
    .cover{position:relative;height:112px;overflow:hidden;}
    .cover .h-wrap{position:absolute;inset:0;display:flex;}
    .cover .h-panel{position:relative;display:flex;align-items:flex-end;padding:12px;overflow:hidden;}
    .cover.img .h-panel{width:42%;} .cover.img .h-photo{width:58%;overflow:hidden;} .cover.full .h-panel{width:100%;}
    .cover .h-photo img{width:100%;height:100%;object-fit:cover;display:block;}
    .cover .h-motif{position:absolute;top:0;right:-8%;height:100%;width:75%;opacity:.5;pointer-events:none;}
    .cover .h-code{position:relative;z-index:2;font-family:var(--display);font-size:36px;line-height:.78;color:#fff;}
    .cover .accent{position:absolute;left:0;bottom:0;width:100%;height:4px;}
    .cover.photo{position:relative;}
    .cover.photo .h-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;}
    .cover.photo .h-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,22,40,.62),transparent 42%);}
    .cover.photo .h-code{position:absolute;top:9px;left:12px;z-index:2;text-shadow:0 2px 6px rgba(0,0,0,.7);}
    .cb{padding:15px 17px 17px;display:flex;flex-direction:column;flex:1;}
    .cb h3{font-family:var(--cond);font-weight:600;font-size:18px;color:#fff;margin:0 0 11px;line-height:1.2;}
    .bar{height:8px;border-radius:6px;background:#0a1c31;border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
    .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--light));border-radius:6px;}
    .prow{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--gray);font-family:var(--cond);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
    .cact{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .cact a{font-family:var(--cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:12px;border-radius:8px;padding:8px 13px;}
    .cact a.primary{background:var(--blue);color:#fff;} .cact a.primary:hover{background:var(--bright);}
    .cact a.ghost{border:1px solid #2a5285;color:var(--light);}
    .done-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#7fe0a8;}
    .cert{position:relative;display:flex;align-items:center;gap:15px;background:linear-gradient(135deg,#12294a,#0f2138);border:1px solid #2a5285;border-radius:14px;padding:17px 19px;box-shadow:var(--shadow-sm);overflow:hidden;}
    .cert::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(224,164,58,.12),transparent 70%);}
    .cert .seal{width:48px;height:48px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#f7e0a0,#c9962f);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(224,164,58,.4);}
    .cert .ct{flex:1;position:relative;z-index:1;min-width:0;} .cert .ct .cn{font-weight:600;color:#fff;font-size:15.5px;}
    .cert .ct .cd{font-family:var(--cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:11.5px;color:var(--light);margin-top:3px;}
    .cert .view{position:relative;z-index:1;font-family:var(--cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:12px;color:#0d2743;background:linear-gradient(135deg,#f3d698,#e0a43a);border-radius:8px;padding:10px 15px;white-space:nowrap;}
    .empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--gray);font-size:14.5px;}
    .empty a{color:var(--light);font-weight:600;}
    .acctbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow-sm);}
    .acctbox .k{font-family:var(--cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--light);}
    .acctbox .v{color:#dbe4f2;font-size:14.5px;margin-top:2px;}
    footer{border-top:1px solid var(--line);padding:26px 0 50px;color:var(--gray);font-size:12.5px;margin-top:34px;}
    .loading{padding:80px 0;text-align:center;color:var(--gray);}
  </style>
</head>
<body>
  <nav>
    <img src="../logo-transparent.png" alt="Gemini Coach" onerror="this.outerHTML='<span class=&quot;logo&quot;></span>'">
    <b>GEMINI EDUCATION</b>
    <div class="sp"></div>
    <a class="nl" href="index.html">Dashboard</a>
    <button class="out" id="signout" style="display:none">Sign out</button>
  </nav>

  <div id="app"><div class="loading">Loading your account…</div></div>

  <footer><div class="wrap">© 2026 Gemini Coach · <a href="index.html">Dashboard</a> · <a href="../education.html">Education home</a> · <a href="../services.html">Coaching</a></div></footer>

  <!-- pre-launch curtain -->
  <script>
    (function(){ var K="gemEduPreviewUnlocked";
      function u(){ try{return sessionStorage.getItem(K)==="yes";}catch(e){return false;} }
      if(!u()) location.replace("coming-soon.html");
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="courses-data.js"></script>
  <script>
  (function(){
    var app = document.getElementById("app");
    var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[m];}); };
    var COMP = ["parker.gemini.coach@gmail.com","ebylander01@gmail.com","liamtsc1@gmail.com","jademckenzie3256@gmail.com"];
    var COURSES = (window.GEMINI_COURSES && window.GEMINI_COURSES.courses) || [];
    var COLORS = {A:{c:"#36c98d",c2:"#1f8f63"},B:{c:"#2e8de8",c2:"#1a6fc4"},C:{c:"#22b6c4",c2:"#147f8a"},D:{c:"#e8a23a",c2:"#b9781f"},E:{c:"#9a6cf0",c2:"#6a44c0"}};

    function motifSVG(track){
      var a=COLORS[track]||COLORS.B, g;
      if(track==="A") g='<circle cx="150" cy="38" r="30"/><circle cx="180" cy="70" r="20"/>';
      else if(track==="B") g='<circle cx="150" cy="60" r="13"/><circle cx="150" cy="60" r="27"/><circle cx="150" cy="60" r="41"/>';
      else if(track==="C") g='<path d="M70 104 A74 74 0 0 1 184 30"/><path d="M104 110 A44 44 0 0 1 184 66"/>';
      else if(track==="D") g='<path d="M120 26 l32 28 l-32 28"/><path d="M150 26 l32 28 l-32 28"/>';
      else g='<path d="M126 30 l20 12 v24 l-20 12 l-20 -12 v-24 z"/><path d="M166 30 l20 12 v24 l-20 12 l-20 -12 v-24 z"/>';
      return '<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="'+a.c+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+g+'</g></svg>';
    }
    function coverHTML(c){
      var a=COLORS[c.track]||COLORS.B;
      var panel='<div class="h-panel" style="background:linear-gradient(155deg,'+a.c2+',#0c1d36)"><div class="h-motif">'+motifSVG(c.track)+'</div><div class="h-code">'+esc(c.code)+'</div></div>';
      var accent='<div class="accent" style="background:'+a.c+'"></div>';
      if(c.image) return '<div class="cover photo"><img class="h-img" loading="lazy" alt="" src="'+esc(c.image)+'"><div class="h-scrim"></div><div class="h-code">'+esc(c.code)+'</div>'+accent+'</div>';
      return '<div class="cover full"><div class="h-wrap">'+panel+'</div>'+accent+'</div>';
    }
    function doneFor(slug){ try { return JSON.parse(localStorage.getItem("gemEduProgress:"+slug)||"[]"); } catch(e){ return []; } }
    function total(c){ return (c.chapters||[]).length || 0; }
    function pct(c){ var t=total(c); if(!t) return 0; return Math.round(100*Math.min(doneFor(c.slug).length,t)/t); }
    function lastCourse(){ try { return JSON.parse(localStorage.getItem("gemEduLast")||"null"); } catch(e){ return null; } }

    if (!window.GEM || !window.GEM.ready) {
      app.innerHTML = '<div class="hero"><div class="wrap"><div class="eyebrow">Gemini Education</div><h1 style="font-family:\'Bebas Neue\',sans-serif;color:#fff;font-size:44px;margin:6px 0">Warming up</h1><p style="color:#aab8d2">Your account service is starting (it was idle). Refresh in a minute.</p></div></div>';
      return;
    }

    GEM.getUser().then(function(user){
      if(!user){ location.replace("login.html"); return; }
      var so=document.getElementById("signout"); so.style.display=""; so.onclick=function(){ GEM.signOut().then(function(){ location.replace("login.html"); }); };

      var name=(user.user_metadata && user.user_metadata.full_name)||"";
      var first=name?name.split(" ")[0]:"there";
      var initial=(name?name.charAt(0):(user.email||"?").charAt(0)).toUpperCase();
      var isComp=COMP.indexOf((user.email||"").toLowerCase())!==-1;

      var started=COURSES.filter(function(c){ return c.published && pct(c)>0; }).sort(function(a,b){ return pct(b)-pct(a); });
      var sumDone=0,sumTotal=0;
      started.forEach(function(c){ sumDone+=Math.min(doneFor(c.slug).length,total(c)); sumTotal+=total(c); });
      var overall=sumTotal?Math.round(100*sumDone/sumTotal):0;
      var completedCount=started.filter(function(c){ return pct(c)===100; }).length;

      Promise.all([
        GEM.listCertificates(),
        GEM.listExamAttempts ? GEM.listExamAttempts() : Promise.resolve([])
      ]).then(function(res){
        var certs=res[0]||[], attempts=res[1]||[];
        var certSlugs={}; certs.forEach(function(c){ certSlugs[c.course_slug]=c; });
        var examBest={}; attempts.forEach(function(a){ if(examBest[a.course_slug]==null||a.score>examBest[a.course_slug]) examBest[a.course_slug]=a.score; });
        var ceu=certs.reduce(function(s,c){ return s+(parseFloat(c.ceu_value)||0); },0);
        render({user:user,first:first,initial:initial,isComp:isComp,started:started,sumDone:sumDone,sumTotal:sumTotal,overall:overall,completedCount:completedCount,certs:certs,certSlugs:certSlugs,examBest:examBest,ceu:ceu});
      });
    });

    function examBarHTML(slug, examBest, certSlugs){
      if(examBest[slug]!=null){ var s=Math.round(examBest[slug]); return '<div class="pcbar"><span class="tag">Exam</span><span class="track"><span class="fill-exam" style="width:'+s+'%"></span></span><span class="val">'+s+'%</span></div>'; }
      if(certSlugs[slug]){ return '<div class="pcbar"><span class="tag">Exam</span><span class="track"><span class="fill-exam" style="width:100%"></span></span><span class="val">Passed</span></div>'; }
      return '<div class="pcbar"><span class="tag">Exam</span><span class="track"><span style="width:0%"></span></span><span class="val na">—</span></div>';
    }
    function courseCard(c, certSlugs){
      var p=pct(c), cert=certSlugs[c.slug], actions;
      if(cert) actions='<span class="done-badge">✓ Complete</span><a class="ghost" href="certificate.html?slug='+encodeURIComponent(c.slug)+'">Certificate</a>';
      else if(p===100) actions='<a class="primary" href="exam.html?slug='+encodeURIComponent(c.slug)+'">Take final exam</a><a class="ghost" href="course.html?slug='+encodeURIComponent(c.slug)+'">Review</a>';
      else actions='<a class="primary" href="course.html?slug='+encodeURIComponent(c.slug)+'">Resume</a>';
      return '<div class="ccard">'+coverHTML(c)+'<div class="cb"><h3>'+esc(c.title)+'</h3>'+
        '<div class="bar"><span style="width:'+p+'%"></span></div>'+
        '<div class="prow"><span>'+p+'% complete</span><span>'+doneFor(c.slug).length+' / '+total(c)+' ch.</span></div>'+
        '<div class="cact">'+actions+'</div></div></div>';
    }

    function render(d){
      var dash=Math.round(2*Math.PI*52*d.overall/100), circ=Math.round(2*Math.PI*52);
      var html='';
      html+='<div class="hero"><div class="wrap heroin">'+
        '<div class="avatar">'+esc(d.initial)+'</div>'+
        '<div><div class="eyebrow">Your learning</div><h1>Welcome back, '+esc(d.first)+'.</h1>'+
        '<div class="statusrow"><span class="chip member">★ '+(d.isComp?"Charter member":"GELL member")+'</span>'+
        '<span class="chip email">'+esc(d.user.email)+'</span></div></div>'+
      '</div></div>';

      html+='<div class="wrap">';

      var last=lastCourse();
      if(last && last.slug){
        html+='<div class="resume"><div><div class="rk">Jump back in</div><div class="rt">'+esc(last.title||"Your course")+'</div></div>'+
          '<a class="btn" href="course.html?slug='+encodeURIComponent(last.slug)+'">Resume course →</a></div>';
      }

      html+='<section class="blk"><div class="sechead"><h2 class="sec">Your snapshot</h2></div><div class="snap">'+
        '<div class="ringcard"><div class="ring">'+
          '<svg width="176" height="176" viewBox="0 0 120 120"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a6fc4"/><stop offset="1" stop-color="#5aaff5"/></linearGradient></defs>'+
          '<circle cx="60" cy="60" r="52" fill="none" stroke="#12233a" stroke-width="13"/>'+
          '<circle cx="60" cy="60" r="52" fill="none" stroke="url(#rg)" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+dash+' '+circ+'" transform="rotate(-90 60 60)"/></svg>'+
          '<div class="mid"><div class="big">'+d.overall+'%</div><div class="lab">Overall</div></div></div>'+
          '<div class="rsub">'+d.sumDone+' of '+d.sumTotal+' chapters read</div></div>'+
        '<div class="tiles">'+
          '<div class="tile b"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11a2 2 0 0 1 2 2v12a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M20 5v12.5a1.5 1.5 0 0 1-1.5 1.5H9"/></svg></span><div class="n">'+d.started.length+'</div><div class="l">Courses started</div></div>'+
          '<div class="tile g"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><div class="n">'+d.completedCount+'</div><div class="l">Read in full</div></div>'+
          '<div class="tile o"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 14.5 8 22l4-2 4 2-1-7.5"/></svg></span><div class="n">'+d.certs.length+'</div><div class="l">Certificates</div></div>'+
          '<div class="tile v"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 8 8 10 4.5-2 8-5 8-10V6z"/></svg></span><div class="n">'+(Math.round(d.ceu*10)/10)+'</div><div class="l">CEUs earned</div></div>'+
        '</div></div></section>';

      if(d.started.length){
        html+='<section class="blk"><div class="sechead"><h2 class="sec">Progress by course</h2></div><div class="chartcard">'+
          d.started.map(function(c){
            var col=(COLORS[c.track]||COLORS.B).c, p=pct(c);
            return '<div class="pcrow"><div class="pchd"><span class="cc" style="background:'+col+'">'+esc(c.code||"")+'</span><span class="pl">'+esc(c.title)+'</span></div>'+
              '<div class="pcbar"><span class="tag">Reading</span><span class="track"><span class="fill-read" style="width:'+p+'%"></span></span><span class="val">'+p+'%</span></div>'+
              examBarHTML(c.slug, d.examBest, d.certSlugs)+'</div>';
          }).join("")+
          '<div class="legend"><span><i style="background:#2e8de8"></i>Reading progress</span><span><i style="background:#e0a43a"></i>Exam score</span><span><i style="background:#5f7391"></i>Not attempted yet</span></div>'+
        '</div></section>';
      }

      html+='<section class="blk"><div class="sechead"><h2 class="sec">Your courses</h2><a class="more" href="index.html">Browse all →</a></div>';
      if(d.started.length) html+='<div class="grid">'+d.started.map(function(c){ return courseCard(c,d.certSlugs); }).join("")+'</div>';
      else html+='<div class="empty">You haven\'t started a course yet. <a href="index.html">Browse the library →</a> and pick where to begin.</div>';
      html+='</section>';

      html+='<section class="blk"><div class="sechead"><h2 class="sec">Your certificates</h2></div>';
      if(d.certs.length){
        html+='<div class="grid">'+d.certs.map(function(c){
          var dt=c.issued_at?new Date(c.issued_at).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}):"";
          var meta=(c.ceu_value!=null?(esc(c.ceu_value)+" CEU · "):"")+esc(dt);
          return '<div class="cert"><div class="seal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5a3d0e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 14.5 8 22l4-2 4 2-1-7.5"/></svg></div>'+
            '<div class="ct"><div class="cn">'+esc(c.course_title||c.course_slug)+'</div><div class="cd">'+meta+'</div></div>'+
            '<a class="view" href="certificate.html?slug='+encodeURIComponent(c.course_slug)+'">View</a></div>';
        }).join("")+'</div>';
      } else html+='<div class="empty">No certificates yet. Finish a course and pass its final exam to earn your first one — it\'ll show up here, ready to download.</div>';
      html+='</section>';

      html+='<section class="blk"><div class="sechead"><h2 class="sec">Account</h2></div>'+
        '<div class="acctbox"><div><div class="k">Signed in as</div><div class="v">'+esc(d.user.email)+'</div></div>'+
        '<button class="out" id="signout2">Sign out</button></div></section>';

      html+='</div>';
      app.innerHTML=html;
      var so2=document.getElementById("signout2");
      if(so2) so2.onclick=function(){ GEM.signOut().then(function(){ location.replace("login.html"); }); };
    }
  })();
  </script>
</body>
</html>
