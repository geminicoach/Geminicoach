<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Final Exam — Gemini Education</title>
  <link rel="icon" href="../logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0a1628; --blue:#1a6fc4; --blue-bright:#2e8de8; --blue-light:#5aaff5;
            --white:#fff; --off-white:#e8edf5; --gray:#8a9ab5; --panel:#0f2138; --line:#1c3354;
            --good:#2ecc71; --bad:#ff8585; }
    * { box-sizing:border-box; }
    body { font-family:'Barlow',system-ui,sans-serif; font-weight:300; color:var(--off-white); margin:0;
           background:var(--navy); line-height:1.55; -webkit-font-smoothing:antialiased; }
    a { text-decoration:none; }
    nav { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line); }
    .logo { width:24px; height:24px; border-radius:6px; background:conic-gradient(from 210deg,var(--blue),var(--blue-light),var(--blue)); }
    nav b { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:19px; letter-spacing:.06em; color:#fff; }
    nav .sp { flex:1; } nav a.back { color:var(--blue-light); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:14px; }
    .wrap { max-width:720px; margin:0 auto; padding:34px 22px 70px; }
    .kicker { font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--blue-light); }
    h1 { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:38px; letter-spacing:.02em; margin:6px 0 4px; color:#fff; }
    .meta { color:var(--gray); font-size:13.5px; margin-bottom:8px; }
    .q { background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:18px 20px; margin:14px 0; }
    .q .qn { font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:12px; color:var(--blue-light); }
    .q h3 { margin:5px 0 12px; font-size:16.5px; color:#fff; font-weight:600; }
    .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; cursor:pointer; }
    .opt:hover { border-color:#2a4a78; } .opt input { margin-top:3px; }
    button.primary { margin-top:8px; padding:13px 24px; border:0; border-radius:9px; background:var(--blue); color:#fff;
                     font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:15px; cursor:pointer; }
    button.primary:hover { background:var(--blue-bright); }
    button.primary:disabled { opacity:.6; cursor:default; }
    button.ghost { margin-top:10px; padding:11px 20px; border:1px solid var(--line); border-radius:9px; background:transparent; color:var(--blue-light);
                   font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.06em; font-size:13px; cursor:pointer; }
    .result { text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:34px; }
    .result .score { font-family:'Bebas Neue',sans-serif; font-size:64px; line-height:1; color:#fff; }
    .result .verdict { font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin-top:6px; }
    .result .verdict.pass { color:var(--good); } .result .verdict.fail { color:var(--bad); }
    .result p { color:var(--gray); margin:12px 0 0; }
    .center { text-align:center; color:var(--gray); padding:40px 0; }
    .center a { color:var(--blue-light); }
    textarea.free { width:100%; background:#0c1d33; border:1px solid var(--line); border-radius:9px; color:var(--off-white);
                    font-family:'Barlow',sans-serif; font-size:14px; padding:11px 13px; resize:vertical; }
    textarea.free:focus { outline:none; border-color:var(--blue-bright); }
    .emsg { color:var(--bad); margin-top:10px; min-height:16px; font-size:13px; }
    .hint { color:var(--gray); font-size:12.5px; margin:0 0 8px; }
    .tfrow { display:flex; gap:10px; }
    .opt.tf { flex:1; justify-content:center; font-weight:600; }
    .matchgrid { display:flex; flex-direction:column; gap:8px; }
    .matchrow { display:flex; gap:10px; align-items:center; }
    .mleft { flex:1; background:#0c1d33; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:14px; }
    .msel { flex:1; min-width:0; background:#0c1d33; border:1px solid var(--line); border-radius:9px; padding:10px 12px; color:var(--off-white); font-family:'Barlow',sans-serif; font-size:14px; }
    .msel:focus { outline:none; border-color:var(--blue-bright); }
    .bank { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
    .tok { background:#12325a; border:1px solid #2a4a78; color:#cfe4ff; border-radius:8px; padding:7px 13px; font-size:14px; font-family:'Barlow',sans-serif; cursor:pointer; }
    .tok:hover { border-color:var(--blue-bright); } .tok.sel { background:var(--blue); border-color:var(--blue-light); color:#fff; }
    .blank { display:inline-block; min-width:74px; text-align:center; border-bottom:2px solid var(--blue-light); color:var(--blue-light); padding:0 6px; cursor:pointer; font-weight:600; }
    .blank.done { color:#fff; border-bottom-color:#fff; }
  </style>
</head>
<body>
  <nav><div class="logo"></div><b>GEMINI EDUCATION</b><div class="sp"></div><a class="back" href="index.html">← Dashboard</a></nav>
  <div class="wrap" id="wrap"><div class="center">Loading…</div></div>

  <script>
    (function(){ var K="gemEduPreviewUnlocked"; function u(){ try{return sessionStorage.getItem(K)==="yes";}catch(e){return false;} } if(!u()) void 0; })();
  </script>
  <script src="courses-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
  (function(){
    var wrap = document.getElementById("wrap");
    var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[m];}); };
    var slug = new URLSearchParams(location.search).get("slug");
    if (!slug) { wrap.innerHTML = '<div class="center">No course specified.</div>'; return; }
    if (!window.GEM || !window.GEM.ready) { wrap.innerHTML = '<div class="center">Accounts service is starting (it was idle). Refresh in a minute.</div>'; return; }

    // tester bypass: ?dev=gemini-dev sets a local flag (?dev=off clears it); some emails always bypass the completion gate
    (function(){ var d=new URLSearchParams(location.search).get("dev");
      try { if(d==="gemini-dev") localStorage.setItem("gemEduDev","1"); else if(d==="off") localStorage.removeItem("gemEduDev"); } catch(e){} })();
    function devFlag(){ try { return localStorage.getItem("gemEduDev")==="1"; } catch(e){ return false; } }
    var BYPASS_EMAILS = ["parker.gemini.coach@gmail.com","pjgrueny@gmail.com"];
    function isBypassUser(user){ return devFlag() || (user && user.email && BYPASS_EMAILS.indexOf(user.email.toLowerCase())!==-1); }

    // soft (client) completion gate — the real integrity anchor is the server-graded exam
    function courseComplete(slug){
      try {
        var data = window.GEMINI_COURSES || {};
        var c = (data.courses||[]).filter(function(x){ return x.slug===slug; })[0];
        if (!c || !(c.chapters||[]).length) return true;
        var done = JSON.parse(localStorage.getItem("gemEduProgress:"+slug)||"[]");
        return c.chapters.every(function(ch){ return done.indexOf(ch.position)!==-1; });
      } catch(e){ return true; }
    }

    window.GEM.getUser().then(function(user){
      if (!user) {
        wrap.innerHTML = '<div class="center">You need to be signed in to take the graded exam and earn a certificate.<br><br><a href="account.html">Sign in or create an account →</a></div>';
        return;
      }
      if (!isBypassUser(user) && !courseComplete(slug)) {
        wrap.innerHTML = '<div class="center">Finish all the chapters in this course before taking the final exam.<br><br><a href="course.html?slug='+encodeURIComponent(slug)+'">Back to the course →</a></div>';
        return;
      }
      window.GEM.getExam(slug).then(function(ex){
        if (!ex || ex.error || !ex.questions) {
          wrap.innerHTML = '<div class="center">'+esc((ex&&ex.error)||"No exam is available for this course yet.")+'</div>';
          return;
        }
        start(user, ex);
      }, function(){ wrap.innerHTML = '<div class="center">Couldn\'t load the exam. Refresh in a minute.</div>'; });
    });

    function start(user, ex){
      var run = ex.questions;          // objective items, shuffled by the server; NO answer key
      var pass = ex.pass_threshold || 80;
      var fillSel = {};                // per-question currently-picked word-bank token

      function typeLabel(t){ return t==="tf"?"True / False":t==="multi"?"Select all that apply":t==="match"?"Matching":t==="fill"?"Fill in the blank":"Multiple choice"; }
      function qHead(r,qi){ return '<div class="qn">Question '+(qi+1)+' · '+typeLabel(r.type)+'</div>'; }
      function fillStem(r){ return esc(r.q).replace(/\{\{(\w+)\}\}/g, function(_,k){ return '<span class="blank" data-q="'+esc(r.id)+'" data-k="'+esc(k)+'">____</span>'; }); }

      function render(){
        var html = '<div class="kicker">'+esc(ex.title)+' · Final Exam</div>'+
          '<h1>Final Exam</h1>'+
          '<div class="meta">Pass mark '+pass+'% · '+run.length+' questions · '+(ex.ceu_value||"")+' CEU on passing</div>';
        html += run.map(function(r,qi){
          var h = '<div class="q">'+qHead(r,qi);
          if (r.type==="fill") {
            h += '<h3>'+fillStem(r)+'</h3>'
              + '<div class="bank" data-q="'+esc(r.id)+'">'+ (r.bank||[]).map(function(tok){ return '<button type="button" class="tok" data-tok="'+esc(tok)+'">'+esc(tok)+'</button>'; }).join("") +'</div>'
              + '<div class="hint">Tap a word, then tap a blank. Tap a filled blank to clear it.</div>';
            return h+'</div>';
          }
          h += '<h3>'+esc(r.q)+'</h3>';
          if (r.type==="mc") { h += (r.options||[]).map(function(o){ return '<label class="opt"><input type="radio" name="'+esc(r.id)+'" value="'+esc(o.v)+'"><span>'+esc(o.text)+'</span></label>'; }).join(""); }
          else if (r.type==="multi") { h += '<div class="hint">Select all that apply.</div>' + (r.options||[]).map(function(o){ return '<label class="opt"><input type="checkbox" class="ck" data-q="'+esc(r.id)+'" value="'+esc(o.v)+'"><span>'+esc(o.text)+'</span></label>'; }).join(""); }
          else if (r.type==="tf") { h += '<div class="tfrow">'
              + '<label class="opt tf"><input type="radio" name="'+esc(r.id)+'" value="true"><span>True</span></label>'
              + '<label class="opt tf"><input type="radio" name="'+esc(r.id)+'" value="false"><span>False</span></label></div>'; }
          else if (r.type==="match") { h += '<div class="matchgrid">' + (r.left||[]).map(function(l){
              return '<div class="matchrow"><div class="mleft">'+esc(l.text)+'</div>'
                + '<select class="msel" data-q="'+esc(r.id)+'" data-li="'+esc(l.li)+'"><option value="">— choose a match —</option>'
                + (r.right||[]).map(function(rt){ return '<option value="'+esc(rt.text)+'">'+esc(rt.text)+'</option>'; }).join("")
                + '</select></div>';
            }).join("") + '</div>'; }
          return h+'</div>';
        }).join("");
        html += '<button class="primary" id="submit">Submit exam</button><div class="emsg" id="emsg"></div>';
        wrap.innerHTML = html;
        wireFill();
        document.getElementById("submit").onclick = submit;
      }

      function wireFill(){
        Array.prototype.forEach.call(document.querySelectorAll('.bank .tok'), function(b){
          b.onclick = function(){
            var bank=b.parentNode, q=bank.getAttribute('data-q'), was=b.classList.contains('sel');
            Array.prototype.forEach.call(bank.querySelectorAll('.tok'), function(x){ x.classList.remove('sel'); });
            if(!was){ b.classList.add('sel'); fillSel[q]=b.getAttribute('data-tok'); } else { delete fillSel[q]; }
          };
        });
        Array.prototype.forEach.call(document.querySelectorAll('.blank'), function(sl){
          sl.onclick = function(){
            var q=sl.getAttribute('data-q');
            if (sl.getAttribute('data-filled')){ sl.removeAttribute('data-filled'); sl.textContent="____"; sl.classList.remove('done'); return; }
            if (fillSel[q]){ sl.setAttribute('data-filled', fillSel[q]); sl.textContent=fillSel[q]; sl.classList.add('done');
              var bank=document.querySelector('.bank[data-q="'+q+'"]'); if(bank){ Array.prototype.forEach.call(bank.querySelectorAll('.tok'),function(x){x.classList.remove('sel');}); } delete fillSel[q]; }
          };
        });
      }

      function submit(){
        var btn = document.getElementById("submit");
        var answers = [], answered = 0;
        run.forEach(function(r){
          if (r.type==="mc"){ var s=document.querySelector('input[name="'+r.id+'"]:checked'); if(s){ answered++; answers.push({ id:r.id, choice:Number(s.value) }); } }
          else if (r.type==="tf"){ var s2=document.querySelector('input[name="'+r.id+'"]:checked'); if(s2){ answered++; answers.push({ id:r.id, choice:(s2.value==="true") }); } }
          else if (r.type==="multi"){ var cks=document.querySelectorAll('.ck[data-q="'+r.id+'"]:checked'); if(cks.length){ answered++; answers.push({ id:r.id, choices:Array.prototype.map.call(cks,function(c){return Number(c.value);}) }); } }
          else if (r.type==="match"){ var sels=document.querySelectorAll('.msel[data-q="'+r.id+'"]'); var pairs={}, any=false; Array.prototype.forEach.call(sels,function(s3){ if(s3.value!==""){ pairs[s3.getAttribute('data-li')]=s3.value; any=true; } }); if(any){ answered++; answers.push({ id:r.id, pairs:pairs }); } }
          else if (r.type==="fill"){ var slots=document.querySelectorAll('.blank[data-q="'+r.id+'"]'); var amap={}, any2=false; Array.prototype.forEach.call(slots,function(sl){ var f=sl.getAttribute('data-filled'); if(f){ amap[sl.getAttribute('data-k')]=f; any2=true; } }); if(any2){ answered++; answers.push({ id:r.id, answers:amap }); } }
        });
        if (answered < run.length) { if(!confirm("You have "+(run.length-answered)+" unanswered question(s). Submit anyway?")) return; }
        btn.disabled = true; btn.textContent = "Submitting…";
        window.GEM.submitExam(slug, answers).then(function(res){
          if (!res || res.error) {
            document.getElementById("emsg").textContent = (res && res.error) ? res.error : "Something went wrong. Try again.";
            btn.disabled = false; btn.textContent = "Submit exam";
            return;
          }
          showResult(res);
        }, function(){
          document.getElementById("emsg").textContent = "Couldn't reach the grader. Try again.";
          btn.disabled = false; btn.textContent = "Submit exam";
        });
      }

      function showResult(res){
        var pct = res.score, passed = res.passed;
        wrap.innerHTML = '<div class="result"><div class="score">'+pct+'%</div>'+
          '<div class="verdict '+(passed?"pass":"fail")+'">'+(passed?"Passed":"Not yet")+'</div>'+
          '<p>You scored '+pct+'%. Pass mark is '+(res.pass_threshold||pass)+'%.</p>'+
          (passed
            ? '<p>Your certificate has been issued.</p><button class="primary" id="cert">View my certificate</button>'
            : '<p>Review the chapters and try again — the questions reshuffle each attempt.</p>')+
          '<div><button class="ghost" id="again">'+(passed?"Retake":"Try again")+'</button></div></div>';
        document.getElementById("again").onclick = function(){
          fillSel = {};
          window.GEM.getExam(slug).then(function(ex2){ if (ex2 && ex2.questions) { run = ex2.questions; } render(); }, render);
        };
        if (passed) document.getElementById("cert").onclick = function(){ location.href = "certificate.html?slug="+encodeURIComponent(slug); };
      }

      render();
    }
  })();
  </script>
</body>
</html>
