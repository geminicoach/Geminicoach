name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 days with no DB activity.
# IMPORTANT: a ping only counts if it executes a REAL authenticated query.
# This sends BOTH headers a real client sends (apikey + Authorization: Bearer),
# prints the HTTP code, and FAILS (red) on anything that isn't a 2xx —
# so a green run truly means a real database query ran and was counted.

on:
  schedule:
    - cron: '23 6 * * *'    # 06:23 UTC daily
    - cron: '23 18 * * *'   # 18:23 UTC daily
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Real authenticated query against Postgres
        run: |
          KEY="sb_publishable_hnDaEyTkttG2Q4yF_YmDpw_tWYcY7c4"
          BASE="https://btnqyetimebksqxxvqxl.supabase.co/rest/v1"
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            "$BASE/exams?select=course_slug&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Accept: application/json")
          echo "HTTP $code"
          echo "Response body:"; cat /tmp/body; echo
          case "$code" in
            2*) echo "OK - real query executed, project marked active." ;;
            *)  echo "FAIL - not a 2xx; this ping did NOT count as activity." >&2; exit 1 ;;
          esac
